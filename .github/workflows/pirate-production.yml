name: PIRATE production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: pirate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'PIRATEglobal/twenty' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pirateglobal/twenty:sha-${{ github.sha }}
          build-args: APP_VERSION=2.8.3
          labels: |
            org.opencontainers.image.source=https://github.com/PIRATEglobal/twenty
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=2.8.3-pirate
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    if: vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check this is still the production head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          current_commit=$(gh api repos/PIRATEglobal/twenty/git/ref/heads/production --jq '.object.sha')
          if [ "$current_commit" = "$EXPECTED_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy through Coolify and verify completion
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"uuid\":\"$COOLIFY_APPLICATION_UUID\"}")
          deployment_uuid=$(jq -er '.deployments[0].deployment_uuid' <<< "$response")
          for attempt in $(seq 1 100); do
            status=$(curl --fail --silent --show-error --max-time 30 \
              "$COOLIFY_URL/api/v1/deployments/$deployment_uuid" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -er '.status')
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled) echo "Coolify deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Timed out waiting for Coolify deployment'
          exit 1
